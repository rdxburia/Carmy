<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarCare Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--orange:#d97706;--red:#dc2626;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#f8fafc)}.authbox{width:min(430px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 20px 60px #0f172a18}.logo{font-size:28px;font-weight:800;margin-bottom:6px}.tag{color:var(--muted);margin-bottom:24px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d7dce5;border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;font-weight:700}.primary{background:var(--blue);color:white}.secondary{background:#eef2ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.ghost{background:transparent;color:var(--muted)}.msg{padding:10px 12px;border-radius:10px;background:#f1f5f9;color:#334155;margin:12px 0;font-size:14px}.msg.err{background:#fef2f2;color:#b91c1c}
.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:22px;padding:8px 10px 22px}.nav button{width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f8fafc}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.formcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.checkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check{border:1px solid var(--border);padding:9px;border-radius:10px;background:#fafafa}.check input{margin-right:7px}.file{border:1px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.right{margin-left:auto}@media(max-width:900px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%;padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media print{.side,.top .actions,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card,.tablewrap{box-shadow:none}.print-title{display:block!important}}
.print-title{display:none}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="authbox">
    <div class="logo">🚗 CarCare Cloud</div><div class="tag">Your private car history, documents & expenses.</div>
    <div id="authmsg" class="msg hidden"></div>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
    <div class="actions"><button class="btn primary" id="loginBtn">Login</button><button class="btn secondary" id="signupBtn">Create account</button></div>
    <button class="btn ghost" id="resetBtn">Forgot password?</button>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="side">
  <div class="brand">🚗 CarCare Cloud</div>
  <div id="carMini" class="muted" style="padding:0 10px 15px"></div>
  <nav class="nav">
    <button data-page="dashboard">🏠 Dashboard</button>
    <button data-page="cars">🚗 My Cars</button>
    <button data-page="entry">🛠️ Add Record</button>
    <button data-page="history">📜 History</button>
    <button data-page="documents">📁 Documents</button>
    <button data-page="report">🖨️ Year Report</button>
  </nav>
  <button id="logoutBtn" class="btn danger" style="width:100%;margin-top:20px">Logout</button>
</aside>
<main class="main">
  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="actions"><h2 id="modalTitle" style="margin:0"></h2><button class="btn ghost right" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const SUPABASE_URL="https://hlrmuvzmaegnbgzvvfsn.supabase.co";
const SUPABASE_KEY="sb_publishable_UxbDw0SkyCxXVrnEwmGDJQ_ec-mbl6q";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,cars=[],currentCar=null,records=[],page="dashboard";

const serviceItems=["Engine Oil","Oil Filter","Air Filter","AC / Cabin Filter","Brake Oil / Brake Fluid","Coolant","Spark Plugs","Brake Pads","Front Brake Disc","Rear Drum Brake / Brake Shoes","Wheel Alignment","Wheel Balancing","Drive Belt","Battery Check","AC Service / AC Gas","Suspension Check","Steering Check","General Inspection","Other"];
const majorItems=["Clutch Plate","Pressure Plate","Release Bearing","Complete Clutch Kit","Gearbox Repair","Gearbox / Transmission Work","Gearbox Oil","Timing Belt / Timing Chain","Engine Mount","Injector / Fuel System Major Work","Head Gasket","Valve / Tappet Major Work","Radiator / Cooling System Major Repair","Water Pump","Thermostat","Engine Overhaul / Rebuild","Alternator","Starter Motor","ECU / Major Engine Electrical Work","Major Engine Sensor","Other Major Engine / Mechanical Work"];

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function status(date){if(!date)return ["MISSING","bad"];let d=(new Date(date+"T23:59:59")-new Date())/86400000;if(d<0)return["EXPIRED","bad"];if(d<=30)return["EXPIRING SOON","warn"];return["VALID","ok"]}
function msg(t,e=false){const x=document.getElementById("authmsg");x.textContent=t;x.className="msg"+(e?" err":"");x.classList.remove("hidden")}
async function init(){const {data:{session}}=await db.auth.getSession();if(session){user=session.user;await loadCars();showApp()}else document.getElementById("auth").classList.remove("hidden");db.auth.onAuthStateChange(async(_s,s)=>{if(s){user=s.user;await loadCars();showApp()}else{user=null;document.getElementById("app").classList.add("hidden");document.getElementById("auth").classList.remove("hidden")}})}
async function loadCars(){const {data,error}=await db.from("cars").select("*").order("registration_no");if(error){alert("Database setup required. Run supabase/schema.sql first.\n\n"+error.message);return}cars=data||[];if(currentCar)currentCar=cars.find(c=>c.id===currentCar.id)||null;if(!currentCar)currentCar=cars[0]||null}
function showApp(){document.getElementById("auth").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("carMini").textContent=currentCar?currentCar.registration_no:"No car selected";render()}
function nav(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.page));
async function loadRecords(){if(!currentCar){records=[];return}const {data,error}=await db.from("records").select("*,record_items(*)").eq("car_id",currentCar.id).order("service_date",{ascending:false});if(error)alert(error.message);records=data||[]}
function render(){if(page==="dashboard")dashboard();if(page==="cars")carsPage();if(page==="entry")entryPage();if(page==="history")historyPage();if(page==="documents")documentsPage();if(page==="report")reportPage()}
async function dashboard(){if(currentCar)await loadRecords();if(!currentCar){document.getElementById("content").innerHTML='<div class="top"><div><h1>Welcome to CarCare Cloud</h1><small>Add your first car to start.</small></div></div><div class="formcard"><button class="btn primary" onclick="nav("cars")">+ Add Car</button></div>';return}
const total=records.reduce((s,r)=>s+Number(r.total_cost||0),0),service=records.filter(r=>r.record_type==="Regular Service").reduce((s,r)=>s+Number(r.total_cost||0),0),repair=total-service;
const ins=status(currentCar.insurance_expiry),puc=status(currentCar.puc_expiry);
document.getElementById("content").innerHTML=`
<div class="top"><div><h1>Car Dashboard</h1><small>${esc(currentCar.registration_no)} · ${esc(currentCar.make_model||"")}</small></div><div class="actions"><button class="btn secondary" onclick="nav('entry')">+ Add Record</button><button class="btn secondary" onclick="nav('documents')">📁 Documents</button></div></div>
<div class="cards">
<div class="card"><div class="muted">Current KM</div><div class="metric">${Number(currentCar.current_km||0).toLocaleString("en-IN")}</div></div>
<div class="card"><div class="muted">Lifetime Cost</div><div class="metric">${money(total)}</div></div>
<div class="card"><div class="muted">Maintenance</div><div class="metric">${money(service)}</div></div>
<div class="card"><div class="muted">Repair / Other</div><div class="metric">${money(repair)}</div></div>
</div>
<div class="section grid2">
<div class="card"><h2>Vehicle</h2><p><b>Registration:</b> ${esc(currentCar.registration_no)}</p><p><b>Owner:</b> ${esc(currentCar.owner_name)}</p><p><b>Vehicle:</b> ${esc(currentCar.make_model)} · ${esc(currentCar.model_year)}</p><p><b>Fuel:</b> ${esc(currentCar.fuel)}</p><p><b>VIN/Chassis:</b> ${esc(currentCar.vin||"-")}</p><p><b>Engine No:</b> ${esc(currentCar.engine_no||"-")}</p></div>
<div class="card"><h2>Documents Status</h2><p>Insurance: <span class="status ${ins[1]}">${ins[0]}</span> ${esc(currentCar.insurance_expiry||"")}</p><p>PUC: <span class="status ${puc[1]}">${puc[0]}</span> ${esc(currentCar.puc_expiry||"")}</p><button class="btn secondary" onclick="editCar()">Update Insurance / PUC</button></div>
</div>
<div class="section card"><h2>Recent History</h2>${records.length?'<div class="tablewrap"><table class="table"><tr><th>Date</th><th>KM</th><th>Type</th><th>Description</th><th>Total</th></tr>'+records.slice(0,8).map(r=>`<tr><td>${esc(r.service_date)}</td><td>${Number(r.odometer_km).toLocaleString("en-IN")}</td><td>${esc(r.record_type)}</td><td>${esc(r.description)}</td><td>${money(r.total_cost)}</td></tr>`).join("")+'</table></div>':'<div class="empty">No records yet.</div>'}</div>`;
}
function carsPage(){document.getElementById("content").innerHTML=`<div class="top"><div><h1>My Cars</h1><small>Every car has separate history and documents.</small></div><button class="btn primary" onclick="addCar()">+ Add Car</button></div><div class="grid3">${cars.map(c=>`<div class="card"><h2>${esc(c.registration_no)}</h2><div class="muted">${esc(c.make_model)} · ${esc(c.model_year)} · ${esc(c.fuel)}</div><p>Current KM: <b>${Number(c.current_km||0).toLocaleString("en-IN")}</b></p><div class="actions"><button class="btn primary" onclick="selectCar('${c.id}')">Open</button><button class="btn secondary" onclick="editCar('${c.id}')">Edit</button></div></div>`).join("")||'<div class="card empty">No cars added.</div>'}</div>`}
async function selectCar(id){currentCar=cars.find(c=>c.id===id);document.getElementById("carMini").textContent=currentCar.registration_no;nav("dashboard")}
function carForm(c={}){return `<div class="grid2"><div class="field"><label>Registration Number *</label><input id="freg" value="${esc(c.registration_no)}"></div><div class="field"><label>Owner Name</label><input id="fowner" value="${esc(c.owner_name)}"></div><div class="field"><label>Make / Model *</label><input id="fmodel" value="${esc(c.make_model)}" placeholder="Hyundai Grand i10"></div><div class="field"><label>Model Year</label><input id="fyear" type="number" value="${esc(c.model_year)}"></div><div class="field"><label>Fuel</label><select id="ffuel"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option><option>Hybrid</option></select></div><div class="field"><label>Current KM</label><input id="fkm" type="number" value="${esc(c.current_km||0)}"></div><div class="field"><label>VIN / Chassis</label><input id="fvin" value="${esc(c.vin)}"></div><div class="field"><label>Engine Number</label><input id="feng" value="${esc(c.engine_no)}"></div><div class="field"><label>Insurance Company</label><input id="ficomp" value="${esc(c.insurance_company)}"></div><div class="field"><label>Insurance Expiry *</label><input id="fiexp" type="date" value="${esc(c.insurance_expiry)}"></div><div class="field"><label>PUC Certificate Number</label><input id="fpucno" value="${esc(c.puc_certificate_no)}"></div><div class="field"><label>PUC Expiry *</label><input id="fpucexp" type="date" value="${esc(c.puc_expiry)}"></div></div>`}
function addCar(){openModal("Add Car",carForm(),async()=>{const v={user_id:user.id,registration_no:document.getElementById("freg").value.trim().toUpperCase(),owner_name:document.getElementById("fowner").value,make_model:document.getElementById("fmodel").value,model_year:Number(document.getElementById("fyear").value)||null,fuel:document.getElementById("ffuel").value,current_km:Number(document.getElementById("fkm").value)||0,vin:document.getElementById("fvin").value,engine_no:document.getElementById("feng").value,insurance_company:document.getElementById("ficomp").value,insurance_expiry:document.getElementById("fiexp").value||null,puc_certificate_no:document.getElementById("fpucno").value,puc_expiry:document.getElementById("fpucexp").value||null};if(!v.registration_no||!v.make_model||!v.insurance_expiry||!v.puc_expiry)return alert("Registration, vehicle, Insurance expiry and PUC expiry are required.");const {data,error}=await db.from("cars").insert(v).select().single();if(error)return alert(error.message);cars.push(data);currentCar=data;closeModal();showApp()})}
function editCar(id=currentCar?.id){const c=cars.find(x=>x.id===id)||currentCar;if(!c)return;openModal("Update Car",carForm(c),async()=>{const v={registration_no:document.getElementById("freg").value.trim().toUpperCase(),owner_name:document.getElementById("fowner").value,make_model:document.getElementById("fmodel").value,model_year:Number(document.getElementById("fyear").value)||null,fuel:document.getElementById("ffuel").value,current_km:Number(document.getElementById("fkm").value)||0,vin:document.getElementById("fvin").value,engine_no:document.getElementById("feng").value,insurance_company:document.getElementById("ficomp").value,insurance_expiry:document.getElementById("fiexp").value||null,puc_certificate_no:document.getElementById("fpucno").value,puc_expiry:document.getElementById("fpucexp").value||null};if(!v.registration_no||!v.make_model||!v.insurance_expiry||!v.puc_expiry)return alert("Registration, vehicle, Insurance expiry and PUC expiry are required.");const {data,error}=await db.from("cars").update(v).eq("id",c.id).select().single();if(error)return alert(error.message);cars=cars.map(x=>x.id===c.id?data:x);currentCar=data;closeModal();showApp()})}
function entryPage(){if(!currentCar){document.getElementById("content").innerHTML='<div class="card empty">First add/select a car.</div>';return}const ins=status(currentCar.insurance_expiry),puc=status(currentCar.puc_expiry);document.getElementById("content").innerHTML=`<div class="top"><div><h1>Add Record</h1><small>${esc(currentCar.registration_no)} · one permanent history record</small></div></div>${(ins[0]==="MISSING"||puc[0]==="MISSING")?'<div class="msg err">ENTRY BLOCKED — Please enter Insurance and PUC details first.</div>':''}<div class="formcard"><div class="grid3"><div class="field"><label>Date *</label><input id="rdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Odometer / KM *</label><input id="rkm" type="number" value="${currentCar.current_km||0}"></div><div class="field"><label>Record Type *</label><select id="rtype"><option>Regular Service</option><option>Engine Service</option><option>Brake Work</option><option>Tyre Work</option><option>Battery</option><option>Accident / Repair</option><option>Other</option></select></div></div><div class="field"><label>Service items (Regular Service)</label><div class="checkgrid">${serviceItems.map((x,i)=>`<label class="check"><input type="checkbox" class="ritem" value="${esc(x)}">${esc(x)}</label>`).join("")}</div></div><div class="field"><label>Major Engine / Mechanical items</label><div class="checkgrid">${majorItems.map(x=>`<label class="check"><input type="checkbox" class="mitem" value="${esc(x)}">${esc(x)}</label>`).join("")}</div></div><div class="grid3"><div class="field"><label>Parts Cost</label><input id="rparts" type="number" value="0"></div><div class="field"><label>Labour</label><input id="rlabour" type="number" value="0"></div><div class="field"><label>Other</label><input id="rother" type="number" value="0"></div></div><div class="grid2"><div class="field"><label>Description</label><textarea id="rdesc" placeholder="Work done / details"></textarea></div><div class="field"><label>Workshop / Garage</label><input id="rworkshop"><div class="field"><label>Invoice Number</label><input id="rinvoice"></div></div></div><div class="field"><label>Notes</label><textarea id="rnotes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveRecord()">SAVE RECORD</button><button class="btn secondary" onclick="nav('history')">View History</button></div></div>`}
async function saveRecord(){const ins=status(currentCar.insurance_expiry),puc=status(currentCar.puc_expiry);if(ins[0]==="MISSING"||puc[0]==="MISSING")return alert("ENTRY BLOCKED — Please enter Insurance and PUC details first.");if(ins[0]==="EXPIRED"||puc[0]==="EXPIRED"){if(!confirm("WARNING — Insurance/PUC is expired. Continue?"))return}const type=document.getElementById("rtype").value;const items=[...document.querySelectorAll(".ritem:checked"),...document.querySelectorAll(".mitem:checked")].map(x=>x.value);const parts=Number(document.getElementById("rparts").value)||0,lab=Number(document.getElementById("rlabour").value)||0,other=Number(document.getElementById("rother").value)||0;const payload={user_id:user.id,car_id:currentCar.id,service_date:document.getElementById("rdate").value,odometer_km:Number(document.getElementById("rkm").value)||0,record_type:type,description:document.getElementById("rdesc").value,parts_cost:parts,labour_cost:lab,other_cost:other,total_cost:parts+lab+other,workshop:document.getElementById("rworkshop").value,invoice_no:document.getElementById("rinvoice").value,notes:document.getElementById("rnotes").value};const {data,error}=await db.from("records").insert(payload).select().single();if(error)return alert(error.message);if(items.length){const rows=items.map(item=>({record_id:data.id,item_name:item,quantity:1,cost:0}));const q=await db.from("record_items").insert(rows);if(q.error)return alert(q.error.message)}await db.from("cars").update({current_km:Math.max(Number(currentCar.current_km||0),payload.odometer_km)}).eq("id",currentCar.id);await loadCars();currentCar=cars.find(c=>c.id===currentCar.id);alert("Record saved successfully. Old records were not changed.");nav("dashboard")}
async function historyPage(){if(!currentCar){document.getElementById("content").innerHTML='<div class="card empty">Select a car.</div>';return}await loadRecords();const years=[...new Set(records.map(r=>new Date(r.service_date).getFullYear()))];document.getElementById("content").innerHTML=`<div class="top"><div><h1>History</h1><small>${esc(currentCar.registration_no)}</small></div><div><select id="hy" onchange="filterHistory(this.value)"><option value="all">All Years</option>${years.map(y=>`<option>${y}</option>`).join("")}</select></div></div><div id="historyTable"></div>`;filterHistory("all")}
function filterHistory(y){const arr=y==="all"?records:records.filter(r=>new Date(r.service_date).getFullYear()==y);const total=arr.reduce((s,r)=>s+Number(r.total_cost||0),0);document.getElementById("historyTable").innerHTML=`<div class="cards"><div class="card"><div class="muted">Records</div><div class="metric">${arr.length}</div></div><div class="card"><div class="muted">Total</div><div class="metric">${money(total)}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>Date</th><th>KM</th><th>Type</th><th>Items</th><th>Description</th><th>Total</th></tr>${arr.map(r=>`<tr><td>${esc(r.service_date)}</td><td>${Number(r.odometer_km).toLocaleString("en-IN")}</td><td>${esc(r.record_type)}</td><td>${esc((r.record_items||[]).map(i=>i.item_name).join(", "))}</td><td>${esc(r.description)}</td><td>${money(r.total_cost)}</td></tr>`).join("")}</table></div>`}
async function documentsPage(){if(!currentCar){document.getElementById("content").innerHTML='<div class="card empty">Select a car.</div>';return}const {data,error}=await db.from("documents").select("*").eq("car_id",currentCar.id).order("created_at",{ascending:false});if(error)alert(error.message);document.getElementById("content").innerHTML=`<div class="top"><div><h1>Documents</h1><small>PDFs, receipts, scans and photos stay linked to this car.</small></div></div><div class="formcard"><div class="file"><input id="docfile" type="file" accept=".pdf,image/jpeg,image/png" /><button class="btn primary" style="margin-top:10px" onclick="uploadDoc()">UPLOAD DOCUMENT</button></div></div><div class="section grid3">${(data||[]).map(d=>`<div class="card"><b>${esc(d.file_name)}</b><p class="muted">${esc(d.document_type||"Other")} · ${new Date(d.created_at).toLocaleDateString()}</p><div class="actions"><button class="btn secondary" onclick="openDoc('${d.storage_path}')">Open</button></div></div>`).join("")||'<div class="card empty">No documents uploaded.</div>'}</div>`}
async function uploadDoc(){const f=document.getElementById("docfile").files[0];if(!f)return alert("Select a PDF or image.");const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=user.id+"/"+currentCar.id+"/"+crypto.randomUUID()+"_"+safe;const up=await db.storage.from("car-documents").upload(path,f,{contentType:f.type,upsert:false});if(up.error)return alert(up.error.message);const ins=await db.from("documents").insert({user_id:user.id,car_id:currentCar.id,file_name:f.name,storage_path:path,mime_type:f.type,file_size:f.size,document_type:f.type==="application/pdf"?"PDF":"Photo"});if(ins.error)return alert(ins.error.message);alert("Document uploaded to cloud.");documentsPage()}
async function openDoc(path){const r=await db.storage.from("car-documents").createSignedUrl(path,3600);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,"_blank")}
async function reportPage(){if(!currentCar){document.getElementById("content").innerHTML='<div class="card empty">Select a car.</div>';return}await loadRecords();const years=[...new Set(records.map(r=>new Date(r.service_date).getFullYear()))];document.getElementById("content").innerHTML=`<div class="top no-print"><div><h1>Year Report</h1><small>A4 print / Save as PDF</small></div><div class="actions"><select id="ry"><option>${years[0]||new Date().getFullYear()}</option>${years.slice(1).map(y=>`<option>${y}</option>`).join("")}</select><button class="btn primary" onclick="printReport()">PRINT / SAVE PDF</button></div></div><div id="reportArea"></div>`;buildReport()}
function buildReport(){const y=Number(document.getElementById("ry").value),arr=records.filter(r=>new Date(r.service_date).getFullYear()===y),total=arr.reduce((s,r)=>s+Number(r.total_cost||0),0);document.getElementById("reportArea").innerHTML=`<div class="print-title"><h1>CarCare Cloud — Vehicle Report</h1></div><div class="card"><h2>${esc(currentCar.registration_no)} — ${esc(currentCar.make_model)}</h2><p>Owner: ${esc(currentCar.owner_name)} · Model Year: ${esc(currentCar.model_year)} · Fuel: ${esc(currentCar.fuel)}</p><p>Year: <b>${y}</b> · Current KM: <b>${Number(currentCar.current_km||0).toLocaleString("en-IN")}</b></p><hr><p>Insurance: <b>${status(currentCar.insurance_expiry)[0]}</b> · PUC: <b>${status(currentCar.puc_expiry)[0]}</b></p></div><div class="section tablewrap"><table class="table"><tr><th>Date</th><th>KM</th><th>Type</th><th>Work Done</th><th>Cost</th></tr>${arr.map(r=>`<tr><td>${esc(r.service_date)}</td><td>${Number(r.odometer_km).toLocaleString("en-IN")}</td><td>${esc(r.record_type)}</td><td>${esc((r.record_items||[]).map(i=>i.item_name).join(", ")+(r.description?" — "+r.description:""))}</td><td>${money(r.total_cost)}</td></tr>`).join("")}</table></div><div class="section card"><h2>Yearly Cost Summary</h2><p><b>Total Year Cost:</b> ${money(total)}</p></div>`}
function printReport(){buildReport();window.print()}
function openModal(title,body,save){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body+'<div class="actions" style="margin-top:15px"><button id="modalSave" class="btn primary">Save</button></div>';document.getElementById("modal").classList.remove("hidden");document.getElementById("modalSave").onclick=save}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("loginBtn").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg(error.message,true)}
document.getElementById("signupBtn").onclick=async()=>{const {error}=await db.auth.signUp({email:email.value,password:password.value});if(error)msg(error.message,true);else msg("Account created. Check your email if confirmation is enabled.")}
document.getElementById("resetBtn").onclick=async()=>{if(!email.value)return msg("Enter your email first.",true);const {error}=await db.auth.resetPasswordForEmail(email.value,{redirectTo:location.href});msg(error?error.message:"Password reset email sent.")}
document.getElementById("logoutBtn").onclick=()=>db.auth.signOut();
init();
</script>
</body>
</html>
