name = "carmy-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-07"
workers_dev = true

[vars]
SUPABASE_URL = "https://hlrmuvzmaegnbgzvvfsn.supabase.co"
ALLOWED_ORIGIN = "https://rdxburia.github.io"
R2_S3_ENDPOINT = "https://1bdda74ff7f93e7d176660d0e329b5ce.r2.cloudflarestorage.com"

[[d1_databases]]
binding = "DB"
database_name = "carmy-cache"
database_id = "57c85007-1cf7-470f-bb4d-3b28cbb555b7"

[[r2_buckets]]
binding = "R2"
bucket_name = "carmy-files"

# Cloudflare Workers rate limiting: 120 requests per client IP per 60 seconds.
# This protects public endpoints, auth attempts, cache-webhook brute force,
# and the authenticated API without changing application authorization.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2601008"

[ratelimits.simple]
limit = 120
period = 60

