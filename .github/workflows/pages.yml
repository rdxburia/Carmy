name: Deploy CarCare Cloud to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/shared-public-shell-nav-glossary]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and validate public pages
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f -name '*.html' ! -name 'api-test.html' ! -name 'logo-preview.html' -exec cp {} _site/ \;
          cp -r css js assets icons _site/
          cp favicon.svg _site/
          cp manifest.webmanifest _site/ 2>/dev/null || true
          cp sw.js _site/ 2>/dev/null || true
          cp offline.html _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
          cp _redirects _site/ 2>/dev/null || true
          python3 scripts/render_public_shell.py _site
          bash scripts/check-pages-output.sh
      - name: Upload rendered preview site
        uses: actions/upload-artifact@v4
        with:
          name: torqdesk-rendered-preview
          path: _site
          retention-days: 2
  visual-acceptance:
    needs: validate-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: torqdesk-rendered-preview
          path: _site
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve preview and capture responsive screenshots
        run: |
          mkdir -p /tmp/td-preview/Carmy
          cp -a _site/. /tmp/td-preview/Carmy/
          python3 -m http.server 4173 --directory /tmp/td-preview >/tmp/td-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Carmy/ >/dev/null; then break; fi
            sleep 1
          done
          TORQ_PREVIEW_URL=http://127.0.0.1:4173/Carmy/ node scripts/capture-home-screenshots.mjs
      - name: Upload homepage screenshots and visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torqdesk-home-screenshots
          path: artifacts/torqdesk-home
          retention-days: 14
  deploy:
    needs: [validate-pages, visual-acceptance]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          rm -rf _site
          mkdir -p _site
          # Publish every root HTML page except developer-only diagnostics/previews.
          find . -maxdepth 1 -type f -name '*.html' ! -name 'api-test.html' ! -name 'logo-preview.html' -exec cp {} _site/ \;
          cp -r css js assets icons _site/
          cp favicon.svg _site/
          cp manifest.webmanifest _site/ 2>/dev/null || true
          cp sw.js _site/ 2>/dev/null || true
          cp offline.html _site/ 2>/dev/null || true
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
          cp _redirects _site/ 2>/dev/null || true
          python3 scripts/render_public_shell.py _site
          bash scripts/check-pages-output.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5