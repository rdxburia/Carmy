name: Super Admin PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/super-admin-pr-checks.yml"
  push:
    branches: [feat/super-admin-backend-auth]
    paths:
      - "worker/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/super-admin-pr-checks.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Validate Worker build
        run: npm run build
