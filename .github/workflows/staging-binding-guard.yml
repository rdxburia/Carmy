name: Staging binding isolation

on:
  pull_request:
    paths:
      - "wrangler.staging.toml"
      - "scripts/check-staging-bindings.mjs"
      - ".github/workflows/staging-binding-guard.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.staging.toml"
      - "scripts/check-staging-bindings.mjs"
      - ".github/workflows/staging-binding-guard.yml"

permissions:
  contents: read

jobs:
  staging-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject production resource identifiers in staging config
        run: node scripts/check-staging-bindings.mjs
