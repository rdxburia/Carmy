name: R2 file validation tests

on:
  pull_request:
    paths:
      - "worker/src/file-validation.mjs"
      - "tests/r2-file-validation.test.mjs"
      - ".github/workflows/r2-file-validation.yml"
  push:
    branches:
      - main
    paths:
      - "worker/src/file-validation.mjs"
      - "tests/r2-file-validation.test.mjs"
      - ".github/workflows/r2-file-validation.yml"

permissions:
  contents: read

jobs:
  test-r2-file-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run file-signature regression tests
        run: node --test tests/r2-file-validation.test.mjs
