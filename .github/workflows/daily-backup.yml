name: Carmy Daily Backup

on:
  schedule:
    # 03:00 IST (21:30 UTC) every day
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          docker --version

      - name: Create code backup
        shell: bash
        run: |
          set -euo pipefail
          DATE_UTC="$(date -u +%Y-%m-%d)"
          COMMIT_SHA="$(git rev-parse HEAD)"
          mkdir -p backup-output
          git bundle create "backup-output/Carmy-$DATE_UTC.bundle" --all
          zip -qr "backup-output/Carmy-$DATE_UTC-source.zip" . -x ".git/*" "backup-output/*"
          echo "$COMMIT_SHA" > "backup-output/git-commit.txt"

      - name: Create Supabase PostgreSQL backup
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_BACKUP_DB_URL" ]]; then
            echo "Missing SUPABASE_BACKUP_DB_URL secret."
            exit 1
          fi
          DATE_UTC="$(date -u +%Y-%m-%d)"
          docker run --rm -e PGPASSWORD="" -v "$PWD/backup-output:/backup" postgres:17-alpine pg_dump "$SUPABASE_BACKUP_DB_URL" --format=plain --no-owner --no-privileges --file="/backup/Carmy-Supabase-$DATE_UTC.sql"
          docker run --rm -v "$PWD/backup-output:/backup" postgres:17-alpine pg_dump "$SUPABASE_BACKUP_DB_URL" --format=custom --no-owner --no-privileges --file="/backup/Carmy-Supabase-$DATE_UTC.dump"
          gzip -9 "backup-output/Carmy-Supabase-$DATE_UTC.sql"

      - name: Create backup manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          DATE_UTC="$(date -u +%Y-%m-%d)"
          COMMIT_SHA="$(git rev-parse HEAD)"
          sha256sum backup-output/* > backup-output/SHA256SUMS.txt
          cat > "backup-output/backup-manifest.json" <<EOF
          {
            "backup_date_utc": "$DATE_UTC",
            "repository": "$GITHUB_REPOSITORY",
            "commit_sha": "$COMMIT_SHA",
            "scope": {
              "source_code": true,
              "git_history": true,
              "supabase_postgresql": true,
              "r2_files": false,
              "d1_cache": false
            },
            "next_backup_layers": [
              "Cloudflare R2 files",
              "Cloudflare D1 cache/schema"
            ]
          }
          EOF

      - name: Install Google Drive client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Upload backup to Google Drive
        env:
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for name in GOOGLE_OAUTH_REFRESH_TOKEN GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_DRIVE_FOLDER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name secret."
              exit 1
            fi
          done

          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_OAUTH_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )

          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)

          folder = drive.files().get(
              fileId=folder_id,
              fields="id,name,mimeType",
              supportsAllDrives=True,
          ).execute()

          if folder.get("mimeType") != "application/vnd.google-apps.folder":
              raise RuntimeError("GOOGLE_DRIVE_FOLDER_ID is not a Drive folder.")

          for path in sorted(Path("backup-output").iterdir()):
              metadata = {"name": path.name, "parents": [folder_id]}
              media = MediaFileUpload(
                  str(path),
                  resumable=True,
                  mimetype="application/octet-stream",
              )
              uploaded = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,size",
                  supportsAllDrives=True,
              ).execute()
              print(f"Uploaded: {uploaded.get('name')} ({uploaded.get('size')} bytes)")

          print("Google Drive OAuth backup upload completed.")
          PY

      - name: Backup summary
        run: |
          echo "Carmy code + Supabase database backup completed."
          echo "R2 and D1 backup layers will be added after those services are configured."
